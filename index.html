<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0b1730" />
<title>单词神器</title>
<style>
:root{
  --bg:#07101d;
  --panel:#0d1a33;
  --panel2:#10203e;
  --border:#294873;
  --text:#f7fbff;
  --sub:#9fb1cd;
  --blue:#77aaff;
  --green:#39cc9b;
  --red:#f36f74;
  --rowH:34px;
  --gap:4px;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#07101d;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
body{
  padding-top:env(safe-area-inset-top,0);
  padding-bottom:env(safe-area-inset-bottom,0);
}
button,input,select{font:inherit}
.app{
  width:100%;max-width:980px;height:100dvh;margin:0 auto;
  padding:4px;
  display:grid;
  grid-template-rows: 20.5% 48.5% 14.5% 16.5%;
  gap:4px;
  overflow:hidden;
}
.panel{
  min-height:0;overflow:hidden;
  background:var(--panel);
  border:1px solid var(--border);
}

/* 顶部大字 */
.hero{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4px 8px;
}
.hero-word{
  width:100%;
  flex:1;
  display:flex;align-items:center;justify-content:center;
  white-space:nowrap;overflow:hidden;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(64px,16vw,150px);
  line-height:.88;
  letter-spacing:.5px;
}
.hero-cn{
  height:22px;
  line-height:22px;
  font-size:15px;
  color:#a9c6ff;
  text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  width:100%;
}

/* 12行 */
.words{
  padding:4px 5px;
  display:grid;
  grid-template-rows:repeat(12,1fr);
  gap:3px;
}
.word-row{
  display:grid;
  grid-template-columns:28px minmax(105px,1.35fr) minmax(72px,1fr) 62px 40px;
  gap:4px;
  align-items:center;
  min-height:0;
}
.num{
  width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;
  background:#16427c;color:#a8c8ff;
  font-weight:900;font-size:14px;
}
.txt{
  width:100%;height:100%;min-height:28px;
  padding:0 9px;
  border:1px solid #274a79;
  background:#0d1a33;color:#fff;
  border-radius:10px;outline:none;
  font-size:14px;
}
.txt:focus{border-color:#5d9cff}
.cn{font-size:13px;color:#d8e5ff}
.loop{
  height:100%;min-height:28px;
  border:1px solid #274a79;border-radius:10px;
  display:flex;align-items:center;justify-content:center;gap:3px;
  background:#10213f;
}
.loop span{font-size:9px;color:#a6b8d2;font-weight:800;line-height:1}
.switch{position:relative;width:31px;height:18px;display:inline-block}
.switch input{display:none}
.slider{
  position:absolute;inset:0;border-radius:999px;
  background:#405371;border:1px solid #597299;
  cursor:pointer;
}
.slider:before{
  content:"";position:absolute;width:12px;height:12px;
  left:2px;top:2px;border-radius:50%;background:white;transition:.15s;
}
.switch input:checked + .slider{background:#3d8cff}
.switch input:checked + .slider:before{transform:translateX(13px)}
.spk{
  height:100%;min-height:28px;
  border:1px solid #274a79;border-radius:10px;
  background:#0d1a33;color:#fff;font-size:18px;cursor:pointer;
}

/* 控制区 */
.controls{
  padding:5px 7px;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:auto 1fr;
  gap:5px 8px;
}
.control-top{
  grid-column:1 / -1;
  display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;
}
.field label{
  display:block;font-size:10px;color:#9fb1cd;margin-bottom:3px;line-height:1;
}
select{
  width:100%;height:30px;
  background:#0d1a33;color:#fff;
  border:1px solid #274a79;border-radius:9px;
  padding:0 8px;font-size:13px;outline:none;
}
.voice-badge{
  align-self:end;height:30px;
  display:flex;align-items:center;
  padding:0 8px;border:1px solid #274a79;border-radius:9px;
  color:#79aaff;font-size:10px;font-weight:800;white-space:nowrap;
}
.main-btn{
  border:0;border-radius:10px;color:white;font-weight:900;font-size:17px;cursor:pointer;
}
#startBtn{background:var(--green)}
#stopBtn{background:var(--red)}

/* 已学区 */
.learned{
  padding:5px 7px;
  display:flex;flex-direction:column;
  background:#050505;
}
.learned-head{
  height:18px;display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:4px;
}
.learned-title{font-size:11px;color:#a9c6ff;font-weight:900}
.learned-actions{display:flex;gap:5px}
.mini{
  height:20px;padding:0 7px;border-radius:999px;
  border:1px solid #36537d;background:#0d1a33;color:#dce9ff;
  font-size:10px;font-weight:800;cursor:pointer;
}
.chips{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-auto-rows:28px;
  gap:5px 8px;
  overflow-y:auto;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  border:0;background:transparent;color:#fff;
  font-family:Georgia,"Times New Roman",serif;
  font-size:15px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;
}
.chip:active{color:#79aaff}
.empty{font-size:11px;color:#7f8da5;grid-column:1/-1;padding:5px}

/* iPhone窄屏 */
@media (max-width:430px){
  .app{grid-template-rows:20% 49% 14.5% 16.5%}
  .hero-word{font-size:clamp(56px,15vw,118px)}
  .word-row{
    grid-template-columns:25px minmax(82px,1.25fr) minmax(56px,.9fr) 56px 36px;
    gap:3px;
  }
  .num{width:24px;height:24px;font-size:13px}
  .txt{font-size:13px;padding:0 7px}
  .cn{font-size:12px}
  .loop span{font-size:8px}
  .spk{font-size:17px}
  .chips{grid-template-columns:repeat(4,1fr);gap:4px 6px}
  .chip{font-size:14px}
  .voice-badge{font-size:9px;padding:0 6px}
}
</style>
</head>
<body>
<div class="app">

  <!-- B区：当前单词最大化 -->
  <section class="panel hero">
    <div class="hero-word" id="heroWord">remember</div>
    <div class="hero-cn" id="heroCn">记住</div>
  </section>

  <!-- C区：12个单词，一行过 -->
  <section class="panel words" id="wordRows"></section>

  <!-- 控制区 -->
  <section class="panel controls">
    <div class="control-top">
      <div class="field">
        <label for="gap">单词间隔</label>
        <select id="gap">
          <option value="400">0.4 秒</option>
          <option value="700">0.7 秒</option>
          <option value="1000" selected>1 秒</option>
          <option value="1500">1.5 秒</option>
          <option value="2000">2 秒</option>
        </select>
      </div>
      <div class="field">
        <label for="rate">朗读速度</label>
        <select id="rate">
          <option value="0.70">很慢</option>
          <option value="0.82">慢</option>
          <option value="0.95" selected>正常偏慢</option>
          <option value="1.00">正常</option>
          <option value="1.12">稍快</option>
        </select>
      </div>
      <div class="voice-badge">🇺🇸 美式英语 en-US</div>
    </div>
    <button id="startBtn" class="main-btn">▶ 开始循环</button>
    <button id="stopBtn" class="main-btn">■ 停止</button>
  </section>

  <!-- 底部：自动保存已学过单词，全部可点读 -->
  <section class="panel learned">
    <div class="learned-head">
      <div class="learned-title">已学过单词 · 自动保存 · 点击即读</div>
      <div class="learned-actions">
        <button id="undoLast" class="mini">撤回最后</button>
        <button id="clearLearned" class="mini">清空</button>
      </div>
    </div>
    <div class="chips" id="learnedList"></div>
  </section>

</div>

<script>
const DEFAULTS = [
  ["apple","苹果"],
  ["beautiful","美丽的"],
  ["future","未来"],
  ["remember","记住"],
  ["","",""],["","",""],["","",""],["","",""],
  ["","",""],["","",""],["","",""],["","",""]
];

const DICT = {
  apple:"苹果", beautiful:"美丽的", future:"未来", remember:"记住",
  important:"重要的", different:"不同的", possible:"可能的", problem:"问题",
  answer:"答案", question:"问题", improve:"改善", develop:"开发",
  create:"创建", learn:"学习", study:"学习", language:"语言",
  english:"英语", memory:"记忆", repeat:"重复", understand:"理解",
  because:"因为", before:"以前", after:"以后", always:"总是",
  never:"从不", enough:"足够的", together:"一起", useful:"有用的"
};

const rowsEl = document.getElementById("wordRows");
const heroWord = document.getElementById("heroWord");
const heroCn = document.getElementById("heroCn");
const gapEl = document.getElementById("gap");
const rateEl = document.getElementById("rate");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const learnedList = document.getElementById("learnedList");
const clearLearned = document.getElementById("clearLearned");
const undoLast = document.getElementById("undoLast");

let words = [];
let voices = [];
let running = false;
let token = 0;
let singleIndex = null;
let learned = [];

function clean(v){return (v||"").trim();}
function key(v){return clean(v).toLowerCase();}

function buildRows(){
  rowsEl.innerHTML="";
  for(let i=0;i<12;i++){
    const row=document.createElement("div");
    row.className="word-row";
    row.innerHTML=`
      <div class="num">${i+1}</div>
      <input class="txt en" data-i="${i}" type="text" autocomplete="off" autocapitalize="none" placeholder="word">
      <input class="txt cn" data-i="${i}" type="text" placeholder="中文">
      <div class="loop">
        <span>单循</span>
        <label class="switch">
          <input class="single" data-i="${i}" type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
      <button class="spk" data-i="${i}" aria-label="朗读第${i+1}个单词">🔊</button>`;
    rowsEl.appendChild(row);
  }
}

buildRows();

const enInputs=[...document.querySelectorAll(".en")];
const cnInputs=[...document.querySelectorAll(".cn")];
const singles=[...document.querySelectorAll(".single")];

function getUSVoice(){
  return voices.find(v => /^en-US$/i.test(v.lang) && /Samantha|Ava|Allison|Susan|Alex|Nicky|Aaron|Mark/i.test(v.name))
      || voices.find(v => /^en-US$/i.test(v.lang))
      || null;
}
function loadVoices(){voices=speechSynthesis.getVoices();}
loadVoices();
if("onvoiceschanged" in speechSynthesis) speechSynthesis.onvoiceschanged=loadVoices;

function fitHero(){
  const el=heroWord;
  let size=Math.min(window.innerWidth*0.17,150);
  if(window.innerWidth<431) size=Math.min(window.innerWidth*0.155,118);
  el.style.fontSize=size+"px";
  const max=el.clientWidth-8;
  while(el.scrollWidth>max && size>34){
    size-=2;
    el.style.fontSize=size+"px";
  }
}

function showWord(i){
  const w=clean(enInputs[i].value);
  const c=clean(cnInputs[i].value);
  heroWord.textContent=w||"READY";
  heroCn.textContent=c||"";
  requestAnimationFrame(fitHero);
}

function save(){
  const data={
    items:enInputs.map((e,i)=>[e.value,cnInputs[i].value]),
    singleIndex, gap:gapEl.value, rate:rateEl.value, learned
  };
  localStorage.setItem("word_magic_strong_ui_v1",JSON.stringify(data));
}

function restore(){
  let data=null;
  try{data=JSON.parse(localStorage.getItem("word_magic_strong_ui_v1")||"null")}catch(e){}
  const items = data?.items || DEFAULTS.map(x=>[x[0]||"",x[1]||""]);
  for(let i=0;i<12;i++){
    enInputs[i].value=items[i]?.[0]||"";
    cnInputs[i].value=items[i]?.[1]||"";
  }
  if(Number.isInteger(data?.singleIndex)) singleIndex=data.singleIndex;
  if(data?.gap) gapEl.value=data.gap;
  if(data?.rate) rateEl.value=data.rate;
  if(Array.isArray(data?.learned)) learned=data.learned;
  syncSingles();
  renderLearned();
  showWord(3);
}

function syncSingles(){
  singles.forEach((s,i)=>s.checked=(i===singleIndex));
}

function autoTranslate(i){
  const w=key(enInputs[i].value);
  if(!w) return;
  const found=DICT[w];
  if(found && !clean(cnInputs[i].value)){
    cnInputs[i].value=found;
  }
}

enInputs.forEach((el,i)=>{
  el.addEventListener("input",()=>{
    if(!clean(cnInputs[i].value)){
      const found=DICT[key(el.value)];
      if(found) cnInputs[i].value=found;
    }
    save();
  });
  el.addEventListener("blur",()=>{autoTranslate(i);save();});
});
cnInputs.forEach(el=>el.addEventListener("input",save));
gapEl.addEventListener("change",save);
rateEl.addEventListener("change",save);

singles.forEach((el,i)=>{
  el.addEventListener("change",()=>{
    singleIndex=el.checked?i:null;
    syncSingles();
    save();
  });
});

function addLearned(i){
  const w=clean(enInputs[i].value);
  const c=clean(cnInputs[i].value);
  if(!w) return;
  if(!learned.some(x=>key(x.word)===key(w))){
    learned.push({word:w,cn:c});
    save();
    renderLearned();
  }
}

function renderLearned(){
  learnedList.innerHTML="";
  if(!learned.length){
    const e=document.createElement("div");
    e.className="empty";
    e.textContent="还没有已学过单词；朗读过的单词会自动出现在这里。";
    learnedList.appendChild(e);
    return;
  }
  learned.forEach(item=>{
    const b=document.createElement("button");
    b.className="chip";
    b.type="button";
    b.textContent=item.word;
    b.title=item.cn?`${item.word} · ${item.cn}`:item.word;
    b.addEventListener("click",()=>speakText(item.word,item.cn));
    learnedList.appendChild(b);
  });
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function speakText(word,cn=""){
  return new Promise(resolve=>{
    word=clean(word);
    if(!word){resolve();return;}
    heroWord.textContent=word;
    heroCn.textContent=clean(cn);
    requestAnimationFrame(fitHero);

    const u=new SpeechSynthesisUtterance(word);
    u.lang="en-US";
    u.rate=parseFloat(rateEl.value);
    u.pitch=1;
    const v=getUSVoice();
    if(v) u.voice=v;

    let done=false;
    const finish=()=>{if(!done){done=true;resolve();}};
    u.onend=finish;
    u.onerror=finish;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    setTimeout(finish,9000);
  });
}

async function speakIndex(i,autoSave=true){
  showWord(i);
  if(autoSave) addLearned(i);
  await speakText(enInputs[i].value,cnInputs[i].value);
}

document.querySelectorAll(".spk").forEach(btn=>{
  btn.addEventListener("click",async()=>{
    running=false;token++;
    const i=Number(btn.dataset.i);
    await speakIndex(i,true);
  });
});

function active(){
  if(singleIndex!==null) return clean(enInputs[singleIndex].value)?[singleIndex]:[];
  return Array.from({length:12},(_,i)=>i).filter(i=>clean(enInputs[i].value));
}

async function run(myToken){
  while(running && myToken===token){
    const list=active();
    if(!list.length){running=false;return;}
    for(const i of list){
      if(!running||myToken!==token)return;
      await speakIndex(i,true);
      if(!running||myToken!==token)return;
      await sleep(parseInt(gapEl.value,10));
    }
  }
}

startBtn.addEventListener("click",async()=>{
  running=false;token++;
  speechSynthesis.cancel();
  await sleep(80);
  running=true;
  const t=++token;
  run(t);
});

stopBtn.addEventListener("click",()=>{
  running=false;token++;
  speechSynthesis.cancel();
});

clearLearned.addEventListener("click",()=>{
  learned=[];
  save();
  renderLearned();
});

undoLast.addEventListener("click",()=>{
  if(learned.length){
    learned.pop();
    save();
    renderLearned();
  }
});

window.addEventListener("resize",fitHero);
window.addEventListener("beforeunload",()=>speechSynthesis.cancel());

restore();
fitHero();
</script>
</body>
</html>
