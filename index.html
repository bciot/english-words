<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a1630">
<title>太阳系-英语单词</title>
<style>
:root{--panel:#0d1a33;--border:#294873;--text:#f7fbff;--sub:#9fb1cd;--green:#39cc9b;--red:#f36f74}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
button,input,select{font:inherit}
.app{width:100%;max-width:980px;height:100dvh;margin:0 auto;padding:4px;display:grid;grid-template-rows:23% 47% 14% 16%;gap:4px;overflow:hidden}
.panel{min-height:0;overflow:hidden;background:var(--panel);border:1px solid var(--border)}

.hero{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 8px}
.menu-btn{position:absolute;left:3px;top:3px;width:28px;height:28px;border:1px solid #263a57;border-radius:8px;background:rgba(16,16,16,.90);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.24)}
.menu-lines{width:15px;height:11px;display:flex;flex-direction:column;justify-content:space-between}
.menu-lines i{display:block;height:2px;border-radius:3px;background:#fff}
.hero-word-wrap{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:2px 4px}
.hero-word{display:inline-block;white-space:nowrap;font-family:Georgia,"Times New Roman",serif;font-weight:400;line-height:.82;letter-spacing:0}
.hero-cn{height:18px;line-height:18px;font-size:14px;color:#a9c6ff;text-align:center;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.words{padding:4px 5px;display:grid;grid-template-rows:repeat(12,1fr);gap:3px}
.word-row{display:grid;grid-template-columns:28px minmax(105px,1.35fr) minmax(72px,1fr) 62px 40px;gap:4px;align-items:center;min-height:0}
.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#16427c;color:#a8c8ff;font-weight:900;font-size:14px}
.txt{width:100%;height:100%;min-height:28px;padding:0 9px;border:1px solid #274a79;background:#0d1a33;color:#fff;border-radius:10px;outline:none;font-size:14px}
.txt:focus{border-color:#5d9cff}.cn{font-size:13px;color:#d8e5ff}
.loop{height:100%;min-height:28px;border:1px solid #274a79;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:3px;background:#10213f}
.loop span{font-size:9px;color:#a6b8d2;font-weight:800;line-height:1}
.switch{position:relative;width:31px;height:18px;display:inline-block}.switch input{display:none}
.slider{position:absolute;inset:0;border-radius:999px;background:#405371;border:1px solid #597299;cursor:pointer}
.slider:before{content:"";position:absolute;width:12px;height:12px;left:2px;top:2px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked + .slider{background:#3d8cff}.switch input:checked + .slider:before{transform:translateX(13px)}
.spk{height:100%;min-height:28px;border:1px solid #274a79;border-radius:10px;background:#0d1a33;color:#fff;font-size:18px;cursor:pointer}

.controls{padding:5px 7px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:5px 8px}
.control-top{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.field label{display:block;font-size:10px;color:var(--sub);margin-bottom:3px;line-height:1}
select{width:100%;height:30px;background:#0d1a33;color:#fff;border:1px solid #274a79;border-radius:9px;padding:0 8px;font-size:13px;outline:none}
.voice-badge{align-self:end;height:30px;display:flex;align-items:center;padding:0 8px;border:1px solid #274a79;border-radius:9px;color:#79aaff;font-size:10px;font-weight:800;white-space:nowrap}
.main-btn{border:0;border-radius:10px;color:#fff;font-weight:900;font-size:17px;cursor:pointer}
#startBtn{background:var(--green)}#stopBtn{background:var(--red)}

.learned{padding:5px 7px;display:flex;flex-direction:column;background:#050505}
.learned-head{flex:0 0 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.learned-title{font-size:11px;color:#a9c6ff;font-weight:900}.learned-tip{font-size:9px;color:#77859b}
.chips{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:28px;gap:5px 8px;overflow-y:auto;overflow-x:hidden;align-content:start;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-right:2px}
.chip{border:0;background:transparent;color:#fff;font-family:Georgia,"Times New Roman",serif;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding:0 4px}
.chip:active{color:#79aaff}.empty{font-size:11px;color:#7f8da5;grid-column:1/-1;padding:5px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.48);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:30}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(78vw,320px);background:#0b162a;border-right:1px solid #294873;transform:translateX(-102%);transition:transform .2s ease;z-index:31;padding:calc(env(safe-area-inset-top,0) + 12px) 12px calc(env(safe-area-inset-bottom,0) + 12px);overflow-y:auto;box-shadow:8px 0 24px rgba(0,0,0,.35)}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.drawer-title{font-size:18px;font-weight:900}
.drawer-head-right{display:flex;align-items:center;gap:10px}
.drawer-version{font-size:12px;color:#f24833;font-weight:800}
.drawer-close{width:34px;height:34px;border-radius:10px;border:1px solid #36537d;background:#101d33;color:#fff;font-size:20px;cursor:pointer}
.drawer-section{padding:12px 0;border-top:1px solid #203a62}.drawer-section:first-of-type{border-top:0}
.drawer-label{font-size:12px;color:#7fa9ec;font-weight:900;margin-bottom:8px}
.drawer-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drawer-btn{min-height:38px;border:1px solid #36537d;border-radius:11px;background:#101d33;color:#fff;font-size:13px;font-weight:800;cursor:pointer}
.drawer-btn.danger{border-color:#713947;color:#ffb7c0}
.drawer-placeholder{font-size:12px;line-height:1.45;color:#8190a6}
.drawer-status{margin-top:8px;font-size:11px;color:#86b3ff;min-height:16px}

.modal-scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:40;padding:18px}
.modal-scrim.open{display:flex}
.modal{width:min(92vw,360px);background:#0c1a31;border:1px solid #36537d;border-radius:15px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.modal-title{font-size:17px;font-weight:900;margin-bottom:8px}
.modal-text{font-size:13px;line-height:1.45;color:#aab9cf;margin-bottom:14px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-btn{height:40px;border-radius:11px;border:1px solid #36537d;background:#101d33;color:#fff;font-weight:800;cursor:pointer}
.modal-btn.confirm-danger{border-color:#7a3e4c;color:#ffb7c0}

@media(max-width:430px){
  .word-row{grid-template-columns:25px minmax(82px,1.25fr) minmax(56px,.9fr) 56px 36px;gap:3px}
  .num{width:24px;height:24px;font-size:13px}.txt{font-size:13px;padding:0 7px}.cn{font-size:12px}.loop span{font-size:8px}.spk{font-size:17px}
  .chips{grid-template-columns:repeat(4,1fr);gap:4px 6px}.chip{font-size:14px}.voice-badge{font-size:9px;padding:0 6px}.menu-btn{width:26px;height:26px}
}
</style>
</head>
<body>

<div class="app">
  <section class="panel hero">
    <button id="menuBtn" class="menu-btn" aria-label="打开系统菜单"><span class="menu-lines"><i></i><i></i><i></i></span></button>
    <div class="hero-word-wrap" id="heroWordWrap"><div class="hero-word" id="heroWord">remember</div></div>
    <div class="hero-cn" id="heroCn">记住</div>
  </section>

  <section class="panel words" id="wordRows"></section>

  <section class="panel controls">
    <div class="control-top">
      <div class="field">
        <label for="gap">单词间隔</label>
        <select id="gap">
          <option value="400">0.4 秒</option>
          <option value="700">0.7 秒</option>
          <option value="1000" selected>1 秒</option>
          <option value="1500">1.5 秒</option>
          <option value="2000">2 秒</option>
        </select>
      </div>
      <div class="field">
        <label for="rate">朗读速度</label>
        <select id="rate">
          <option value="super">超慢 · 分解发音</option>
          <option value="extreme">极慢 · 拆字母</option>
          <option value="0.35">很慢</option>
          <option value="0.58">慢</option>
          <option value="0.88">正常偏慢</option>
          <option value="1.00" selected>正常</option>
          <option value="1.15">稍快</option>
        </select>
      </div>
      <div class="voice-badge">🇺🇸 美式英语 en-US</div>
    </div>
    <button id="startBtn" class="main-btn">▶ 开始循环</button>
    <button id="stopBtn" class="main-btn">■ 停止</button>
  </section>

  <section class="panel learned">
    <div class="learned-head">
      <div class="learned-title">已学过单词 · 点击即读</div>
      <div class="learned-tip">可向下滑查看全部</div>
    </div>
    <div class="chips" id="learnedList"></div>
  </section>
</div>

<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="drawer-title">太阳系-英语单词</div>
    <div class="drawer-head-right">
      <span class="drawer-version">V1.5</span>
      <button id="closeDrawer" class="drawer-close">×</button>
    </div>
  </div>

  <div class="drawer-section">
    <div class="drawer-label">已学单词管理</div>
    <div class="drawer-grid">
      <button id="undoLast" class="drawer-btn">撤回最后</button>
      <button id="clearLearned" class="drawer-btn danger">清空已学</button>
      <button id="copyAll" class="drawer-btn">一键复制全部</button>
      <button id="exportTxt" class="drawer-btn">导出 TXT</button>
    </div>
    <div id="drawerStatus" class="drawer-status"></div>
  </div>

  <div class="drawer-section">
    <div class="drawer-label">以后系统功能</div>
    <div class="drawer-placeholder">以后新增的配置、系统设置、数据管理、外观选项、导入/导出等功能，都放在这里，不再占用主学习界面。</div>
  </div>
</aside>

<div id="confirmModal" class="modal-scrim" role="dialog" aria-modal="true">
  <div class="modal">
    <div id="modalTitle" class="modal-title">确认操作</div>
    <div id="modalText" class="modal-text"></div>
    <div class="modal-actions">
      <button id="modalCancel" class="modal-btn">取消</button>
      <button id="modalConfirm" class="modal-btn confirm-danger">确认</button>
    </div>
  </div>
</div>

<script>
const DEFAULTS=[["apple","苹果"],["beautiful","美丽的"],["future","未来"],["remember","记住"],["",""],["",""],["",""],["",""],["",""],["",""],["",""],["",""]];
const DICT={apple:"苹果",beautiful:"美丽的",future:"未来",remember:"记住",important:"重要的",different:"不同的",possible:"可能的",problem:"问题",answer:"答案",question:"问题",improve:"改善",develop:"开发",create:"创建",learn:"学习",study:"学习",language:"语言",english:"英语",memory:"记忆",repeat:"重复",understand:"理解",because:"因为",before:"以前",after:"以后",always:"总是",never:"从不",enough:"足够的",together:"一起",useful:"有用的"};

const rowsEl=document.getElementById("wordRows");
const heroWordWrap=document.getElementById("heroWordWrap");
const heroWord=document.getElementById("heroWord");
const heroCn=document.getElementById("heroCn");
const gapEl=document.getElementById("gap");
const rateEl=document.getElementById("rate");
const startBtn=document.getElementById("startBtn");
const stopBtn=document.getElementById("stopBtn");
const learnedList=document.getElementById("learnedList");

const menuBtn=document.getElementById("menuBtn");
const drawer=document.getElementById("drawer");
const scrim=document.getElementById("scrim");
const closeDrawer=document.getElementById("closeDrawer");
const undoLast=document.getElementById("undoLast");
const clearLearned=document.getElementById("clearLearned");
const copyAll=document.getElementById("copyAll");
const exportTxt=document.getElementById("exportTxt");
const drawerStatus=document.getElementById("drawerStatus");

const confirmModal=document.getElementById("confirmModal");
const modalTitle=document.getElementById("modalTitle");
const modalText=document.getElementById("modalText");
const modalCancel=document.getElementById("modalCancel");
const modalConfirm=document.getElementById("modalConfirm");

let voices=[],running=false,token=0,singleIndex=null,learned=[],pendingConfirm=null;

function clean(v){return(v||"").trim()}
function key(v){return clean(v).toLowerCase()}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

function buildRows(){
  rowsEl.innerHTML="";
  for(let i=0;i<12;i++){
    const row=document.createElement("div");
    row.className="word-row";
    row.innerHTML=`<div class="num">${i+1}</div>
      <input class="txt en" data-i="${i}" type="text" autocomplete="off" autocapitalize="none" placeholder="word">
      <input class="txt cn" data-i="${i}" type="text" placeholder="中文">
      <div class="loop"><span>单循</span><label class="switch"><input class="single" data-i="${i}" type="checkbox"><span class="slider"></span></label></div>
      <button class="spk" data-i="${i}" aria-label="朗读第${i+1}个单词">🔊</button>`;
    rowsEl.appendChild(row);
  }
}
buildRows();

const enInputs=[...document.querySelectorAll(".en")];
const cnInputs=[...document.querySelectorAll(".cn")];
const singles=[...document.querySelectorAll(".single")];

function getUSVoice(){
  return voices.find(v=>/^en-US$/i.test(v.lang)&&/Samantha|Ava|Allison|Susan|Alex|Nicky|Aaron|Mark/i.test(v.name))
      ||voices.find(v=>/^en-US$/i.test(v.lang))||null;
}
function loadVoices(){voices=speechSynthesis.getVoices()}
loadVoices();
if("onvoiceschanged"in speechSynthesis)speechSynthesis.onvoiceschanged=loadVoices;

/* 一眼记：正常比例，尽量填满可用区域 */
function fitHero(){
  const maxW=Math.max(20,heroWordWrap.clientWidth-8);
  const maxH=Math.max(20,heroWordWrap.clientHeight-2);
  let lo=20,hi=340,best=20;
  for(let n=0;n<17;n++){
    const mid=(lo+hi)/2;
    heroWord.style.fontSize=mid+"px";
    const r=heroWord.getBoundingClientRect();
    if(r.width<=maxW&&r.height<=maxH){best=mid;lo=mid}else{hi=mid}
  }
  heroWord.style.fontSize=best+"px";
}
function showText(word,cn=""){
  heroWord.textContent=clean(word)||"READY";
  heroCn.textContent=clean(cn);
  requestAnimationFrame(fitHero);
}
function showWord(i){showText(enInputs[i].value,cnInputs[i].value)}

function save(){
  localStorage.setItem("word_magic_strong_ui_v3",JSON.stringify({
    items:enInputs.map((e,i)=>[e.value,cnInputs[i].value]),
    singleIndex,gap:gapEl.value,rate:rateEl.value,learned
  }));
}
function restore(){
  let data=null;
  try{data=JSON.parse(localStorage.getItem("word_magic_strong_ui_v3")||"null")}catch(e){}
  const items=data?.items||DEFAULTS;
  for(let i=0;i<12;i++){enInputs[i].value=items[i]?.[0]||"";cnInputs[i].value=items[i]?.[1]||""}
  if(Number.isInteger(data?.singleIndex))singleIndex=data.singleIndex;
  if(data?.gap)gapEl.value=data.gap;
  if(data?.rate)rateEl.value=data.rate;
  if(Array.isArray(data?.learned))learned=data.learned;
  syncSingles();renderLearned();showWord(3);
}
function syncSingles(){singles.forEach((s,i)=>s.checked=(i===singleIndex))}

enInputs.forEach((el,i)=>{
  el.addEventListener("input",()=>{
    if(!clean(cnInputs[i].value)){const f=DICT[key(el.value)];if(f)cnInputs[i].value=f}
    save()
  });
  el.addEventListener("blur",()=>{
    const f=DICT[key(el.value)];
    if(f&&!clean(cnInputs[i].value))cnInputs[i].value=f;
    save()
  });
});
cnInputs.forEach(el=>el.addEventListener("input",save));
gapEl.addEventListener("change",save);
rateEl.addEventListener("change",save);
singles.forEach((el,i)=>el.addEventListener("change",()=>{singleIndex=el.checked?i:null;syncSingles();save()}));

function addLearned(i){
  const w=clean(enInputs[i].value),c=clean(cnInputs[i].value);
  if(!w)return;
  if(!learned.some(x=>key(x.word)===key(w))){learned.push({word:w,cn:c});save();renderLearned()}
}
function renderLearned(){
  learnedList.innerHTML="";
  if(!learned.length){
    const e=document.createElement("div");
    e.className="empty";
    e.textContent="还没有已学过单词；朗读过的单词会自动保存在这里。";
    learnedList.appendChild(e);
    return;
  }
  learned.forEach(item=>{
    const b=document.createElement("button");
    b.className="chip";b.type="button";b.textContent=item.word;
    b.title=item.cn?`${item.word} · ${item.cn}`:item.word;
    b.addEventListener("click",()=>speakText(item.word,item.cn));
    learnedList.appendChild(b);
  });
}


/* “超慢·分解发音”：
   优先使用人工校准的美式英语发音片段；未知单词再退回启发式音节分段。
   这样比逐字母更接近真实发音部分。 */
const PRON_PARTS = {
  apple:["ap","uhl"],
  beautiful:["byoo","tuh","fuhl"],
  future:["fyoo","cher"],
  remember:["rih","mem","ber"],
  important:["im","por","tnt"],
  different:["dif","er","ent"],
  possible:["pos","uh","buhl"],
  problem:["prob","lem"],
  answer:["an","ser"],
  question:["kwes","chun"],
  improve:["im","proov"],
  develop:["dih","vel","up"],
  create:["kree","ayt"],
  learn:["lern"],
  study:["stuh","dee"],
  language:["lang","gwij"],
  english:["ing","glish"],
  memory:["mem","uh","ree"],
  repeat:["rih","peet"],
  understand:["un","der","stand"],
  because:["bih","kawz"],
  before:["bih","for"],
  after:["af","ter"],
  always:["awl","wayz"],
  never:["nev","er"],
  enough:["ih","nuf"],
  together:["tuh","geh","ther"],
  useful:["yoos","fuhl"]
};

function heuristicParts(word){
  const w = key(word).replace(/[^a-z]/g,"");
  if(!w) return [];
  // 对常见英语后缀先做一点处理，再按元音群粗略切分。
  const suffixes = ["tion","sion","ture","sure","ment","ness","less","ful","ing","ed","er","ly"];
  let stem = w, suffix = "";
  for(const s of suffixes){
    if(w.length > s.length + 2 && w.endsWith(s)){
      stem = w.slice(0,-s.length);
      suffix = s;
      break;
    }
  }
  const parts = [];
  let cur = "";
  const vowels = /[aeiouy]/;
  for(let i=0;i<stem.length;i++){
    cur += stem[i];
    const hereV = vowels.test(stem[i]);
    const next = stem[i+1] || "";
    const nextNext = stem[i+2] || "";
    if(hereV && next && !vowels.test(next) && nextNext && vowels.test(nextNext)){
      parts.push(cur);
      cur = "";
    }
  }
  if(cur) parts.push(cur);
  if(suffix) parts.push(suffix);
  return parts.length ? parts : [w];
}

function pronunciationParts(word){
  const w = key(word);
  return PRON_PARTS[w] || heuristicParts(w);
}

async function speakSuperSlow(word){
  speechSynthesis.cancel();

  // 先完整、很慢地读一次，给用户建立正确整体发音。
  await speakUtterance(word,0.30);
  await sleep(220);

  // 再逐个“发音部分”读，使用校准过的自然英文拼读文本。
  const parts = pronunciationParts(word);
  for(const part of parts){
    if(!part) continue;
    heroCn.textContent = "分解：" + parts.join(" · ");
    await speakUtterance(part,0.42);
    await sleep(180);
  }

  // 最后再把整词读一次，帮助把各部分重新合并。
  await sleep(180);
  heroCn.textContent = "";
  await speakUtterance(word,0.38);
}

/* 普通语速 */
function speakUtterance(text,rate){
  return new Promise(resolve=>{
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-US";u.rate=rate;u.pitch=1;
    const v=getUSVoice();if(v)u.voice=v;
    let done=false;
    const finish=()=>{if(!done){done=true;resolve()}};
    u.onend=finish;u.onerror=finish;
    speechSynthesis.speak(u);
    setTimeout(finish,15000);
  });
}

/* 极慢：先整词超慢，再逐字母分解，达到明显“拆音/拆字母”的效果 */
async function speakExtreme(word){
  speechSynthesis.cancel();
  await speakUtterance(word,0.22);
  if(!running && token<0)return;

  const chars=[...word].filter(ch=>/[A-Za-z]/.test(ch));
  if(chars.length){
    await sleep(180);
    for(const ch of chars){
      if(!ch)continue;
      await speakUtterance(ch,0.45);
      await sleep(120);
    }
  }
}

function speakText(word,cn=""){
  return new Promise(async resolve=>{
    word=clean(word);
    if(!word){resolve();return}
    showText(word,cn);

    speechSynthesis.cancel();
    const mode=rateEl.value;

    if(mode==="super"){
      await speakSuperSlow(word);
      heroCn.textContent=clean(cn);
      resolve();
      return;
    }

    if(mode==="extreme"){
      await speakExtreme(word);
      heroCn.textContent=clean(cn);
      resolve();
      return;
    }

    await speakUtterance(word,parseFloat(mode));
    resolve();
  });
}

async function speakIndex(i,autoSave=true){
  showWord(i);
  if(autoSave)addLearned(i);
  await speakText(enInputs[i].value,cnInputs[i].value);
}

document.querySelectorAll(".spk").forEach(btn=>btn.addEventListener("click",async()=>{
  running=false;token++;
  await speakIndex(Number(btn.dataset.i),true);
}));

function active(){
  if(singleIndex!==null)return clean(enInputs[singleIndex].value)?[singleIndex]:[];
  return Array.from({length:12},(_,i)=>i).filter(i=>clean(enInputs[i].value));
}
async function run(myToken){
  while(running&&myToken===token){
    const list=active();
    if(!list.length){running=false;return}
    for(const i of list){
      if(!running||myToken!==token)return;
      await speakIndex(i,true);
      if(!running||myToken!==token)return;
      await sleep(parseInt(gapEl.value,10));
    }
  }
}
startBtn.addEventListener("click",async()=>{
  running=false;token++;speechSynthesis.cancel();await sleep(80);
  running=true;const t=++token;run(t)
});
stopBtn.addEventListener("click",()=>{
  running=false;token++;speechSynthesis.cancel()
});

/* 侧窗 */
function openDrawer(){drawer.classList.add("open");scrim.classList.add("open");drawer.setAttribute("aria-hidden","false");drawerStatus.textContent=""}
function closeDrawerFn(){drawer.classList.remove("open");scrim.classList.remove("open");drawer.setAttribute("aria-hidden","true")}
menuBtn.addEventListener("click",openDrawer);
closeDrawer.addEventListener("click",closeDrawerFn);
scrim.addEventListener("click",closeDrawerFn);

/* 确认窗口 */
function askConfirm(title,text,onConfirm){
  modalTitle.textContent=title;
  modalText.textContent=text;
  pendingConfirm=onConfirm;
  confirmModal.classList.add("open");
}
function closeConfirm(){confirmModal.classList.remove("open");pendingConfirm=null}
modalCancel.addEventListener("click",closeConfirm);
confirmModal.addEventListener("click",e=>{if(e.target===confirmModal)closeConfirm()});
modalConfirm.addEventListener("click",()=>{
  const fn=pendingConfirm;
  closeConfirm();
  if(fn)fn();
});

undoLast.addEventListener("click",()=>{
  if(!learned.length){drawerStatus.textContent="当前没有已学单词。";return}
  const last=learned[learned.length-1];
  askConfirm("撤回最后一个？",`将从已学单词中移除：${last.word}${last.cn?" · "+last.cn:""}`,()=>{
    learned.pop();save();renderLearned();drawerStatus.textContent="已撤回最后一个。"
  });
});

clearLearned.addEventListener("click",()=>{
  if(!learned.length){drawerStatus.textContent="当前没有已学单词。";return}
  askConfirm("清空全部已学单词？",`将删除当前保存的 ${learned.length} 个已学单词。此操作不可自动恢复。`,()=>{
    learned=[];save();renderLearned();drawerStatus.textContent="已清空全部已学单词。"
  });
});

/* 一键复制全部 */
function learnedText(){
  return learned.map(x=>x.cn?`${x.word}\t${x.cn}`:x.word).join("\n");
}
copyAll.addEventListener("click",async()=>{
  if(!learned.length){drawerStatus.textContent="当前没有可复制的已学单词。";return}
  const text=learnedText();
  try{
    await navigator.clipboard.writeText(text);
    drawerStatus.textContent=`已复制 ${learned.length} 个单词。`;
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");drawerStatus.textContent=`已复制 ${learned.length} 个单词。`}
    catch(err){drawerStatus.textContent="复制失败，请重试。"}
    ta.remove();
  }
});

/* 导出 TXT */
exportTxt.addEventListener("click",()=>{
  if(!learned.length){drawerStatus.textContent="当前没有可导出的已学单词。";return}
  const header="太阳系-英语单词 · 已学单词\n\n";
  const blob=new Blob([header+learnedText()+"\n"],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  const d=new Date();
  const stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  a.download=`已学单词-${stamp}.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  drawerStatus.textContent=`已生成 TXT，共 ${learned.length} 个单词。`;
});

window.addEventListener("resize",fitHero);
window.addEventListener("orientationchange",()=>setTimeout(fitHero,150));
window.addEventListener("beforeunload",()=>speechSynthesis.cancel());

restore();
fitHero();
</script>
