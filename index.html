<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>每日 4 个英语单词</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --sub: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
      --danger: #dc2626;
      --ok: #059669;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --card: #111827;
        --text: #f9fafb;
        --sub: #9ca3af;
        --border: #374151;
        --accent: #60a5fa;
        --danger: #f87171;
        --ok: #34d399;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 620px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }
    h1 {
      font-size: 30px;
      margin: 0 0 8px;
      text-align: center;
    }
    .desc {
      text-align: center;
      color: var(--sub);
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }
    .word-row {
      display: grid;
      grid-template-columns: 42px 1fr 54px;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .num {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent);
      font-weight: 700;
    }
    input, select {
      width: 100%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 18px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .speak-one {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 12px;
      min-height: 46px;
      font-size: 22px;
      cursor: pointer;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }
    button.main {
      border: 0;
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 18px;
      font-weight: 700;
      color: white;
      cursor: pointer;
    }
    #startBtn { background: var(--ok); }
    #stopBtn { background: var(--danger); }
    .settings {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 6px;
    }
    .status {
      margin-top: 18px;
      text-align: center;
      min-height: 24px;
      color: var(--sub);
      font-size: 15px;
    }
    .current {
      color: var(--accent);
      font-weight: 700;
      font-size: 24px;
    }
    .hint {
      margin-top: 18px;
      color: var(--sub);
      font-size: 13px;
      line-height: 1.6;
    }
    @media (max-width: 480px) {
      h1 { font-size: 26px; }
      .settings { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>每日 4 个英语单词</h1>
    <div class="desc">输入 4 个单词，点击开始后自动循环朗读。单词会保存在本机浏览器中。</div>

    <div class="card">
      <div class="word-row">
        <div class="num">1</div>
        <input id="w1" type="text" value="apple" autocomplete="off" autocapitalize="none" />
        <button class="speak-one" data-target="w1" aria-label="朗读第1个单词">🔊</button>
      </div>
      <div class="word-row">
        <div class="num">2</div>
        <input id="w2" type="text" value="beautiful" autocomplete="off" autocapitalize="none" />
        <button class="speak-one" data-target="w2" aria-label="朗读第2个单词">🔊</button>
      </div>
      <div class="word-row">
        <div class="num">3</div>
        <input id="w3" type="text" value="future" autocomplete="off" autocapitalize="none" />
        <button class="speak-one" data-target="w3" aria-label="朗读第3个单词">🔊</button>
      </div>
      <div class="word-row">
        <div class="num">4</div>
        <input id="w4" type="text" value="remember" autocomplete="off" autocapitalize="none" />
        <button class="speak-one" data-target="w4" aria-label="朗读第4个单词">🔊</button>
      </div>

      <div class="settings">
        <div>
          <label for="gap">单词间隔</label>
          <select id="gap">
            <option value="500">0.5 秒</option>
            <option value="1000" selected>1 秒</option>
            <option value="1500">1.5 秒</option>
            <option value="2000">2 秒</option>
            <option value="3000">3 秒</option>
          </select>
        </div>
        <div>
          <label for="rate">朗读速度</label>
          <select id="rate">
            <option value="0.65">很慢</option>
            <option value="0.8">慢</option>
            <option value="0.95" selected>正常偏慢</option>
            <option value="1.0">正常</option>
            <option value="1.15">稍快</option>
          </select>
        </div>
      </div>

      <div class="controls">
        <button id="startBtn" class="main">▶ 开始循环</button>
        <button id="stopBtn" class="main">■ 停止</button>
      </div>

      <div class="status" id="status">准备好了</div>
      <div class="hint">
        发音优先选择设备里的 <b>English (United States)</b> 美式英语语音。
        iPhone / iPad 上请先点一次“开始循环”，浏览器才允许语音播放。
      </div>
    </div>
  </div>

  <script>
    const inputIds = ["w1", "w2", "w3", "w4"];
    const inputs = inputIds.map(id => document.getElementById(id));
    const gapEl = document.getElementById("gap");
    const rateEl = document.getElementById("rate");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusEl = document.getElementById("status");

    let running = false;
    let loopToken = 0;
    let voices = [];

    function loadVoices() {
      voices = speechSynthesis.getVoices();
    }

    loadVoices();
    if ("onvoiceschanged" in speechSynthesis) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    function getUSVoice() {
      return (
        voices.find(v => /^en-US$/i.test(v.lang) && /Samantha|Ava|Allison|Susan|Alex/i.test(v.name)) ||
        voices.find(v => /^en-US$/i.test(v.lang)) ||
        voices.find(v => /^en/i.test(v.lang)) ||
        null
      );
    }

    function saveSettings() {
      const data = {
        words: inputs.map(i => i.value),
        gap: gapEl.value,
        rate: rateEl.value
      };
      localStorage.setItem("fourWordsSettings", JSON.stringify(data));
    }

    function restoreSettings() {
      try {
        const raw = localStorage.getItem("fourWordsSettings");
        if (!raw) return;
        const data = JSON.parse(raw);
        if (Array.isArray(data.words)) {
          inputs.forEach((input, i) => {
            if (typeof data.words[i] === "string") input.value = data.words[i];
          });
        }
        if (data.gap) gapEl.value = data.gap;
        if (data.rate) rateEl.value = data.rate;
      } catch (e) {}
    }

    restoreSettings();

    inputs.forEach(i => i.addEventListener("input", saveSettings));
    gapEl.addEventListener("change", saveSettings);
    rateEl.addEventListener("change", saveSettings);

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function speakWord(word) {
      return new Promise(resolve => {
        if (!word.trim()) {
          resolve();
          return;
        }

        speechSynthesis.cancel();

        const u = new SpeechSynthesisUtterance(word.trim());
        u.lang = "en-US";
        u.rate = parseFloat(rateEl.value);
        u.pitch = 1.0;
        const voice = getUSVoice();
        if (voice) u.voice = voice;

        let finished = false;
        const done = () => {
          if (!finished) {
            finished = true;
            resolve();
          }
        };

        u.onend = done;
        u.onerror = done;
        speechSynthesis.speak(u);

        // 极端情况下浏览器不触发 onend 时，避免循环卡死
        setTimeout(done, 10000);
      });
    }

    async function runLoop(myToken) {
      while (running && myToken === loopToken) {
        const words = inputs.map(i => i.value.trim()).filter(Boolean);

        if (words.length === 0) {
          statusEl.textContent = "请至少输入 1 个单词";
          running = false;
          return;
        }

        for (const word of words) {
          if (!running || myToken !== loopToken) return;

          statusEl.innerHTML = `正在朗读：<span class="current">${escapeHtml(word)}</span>`;
          await speakWord(word);

          if (!running || myToken !== loopToken) return;
          await sleep(parseInt(gapEl.value, 10));
        }
      }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[c]));
    }

    startBtn.addEventListener("click", async () => {
      saveSettings();
      speechSynthesis.cancel();
      running = false;
      loopToken++;
      await sleep(80);

      running = true;
      const myToken = loopToken;
      runLoop(myToken);
    });

    stopBtn.addEventListener("click", () => {
      running = false;
      loopToken++;
      speechSynthesis.cancel();
      statusEl.textContent = "已停止";
    });

    document.querySelectorAll(".speak-one").forEach(btn => {
      btn.addEventListener("click", async () => {
        const input = document.getElementById(btn.dataset.target);
        running = false;
        loopToken++;
        speechSynthesis.cancel();
        statusEl.innerHTML = `正在朗读：<span class="current">${escapeHtml(input.value.trim())}</span>`;
        await speakWord(input.value);
        statusEl.textContent = "准备好了";
      });
    });

    // 页面关闭或切换时停止，避免后台残留
    window.addEventListener("beforeunload", () => speechSynthesis.cancel());
  </script>
</body>
</html>
